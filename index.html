<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SBDC Supply Chain Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.plot.ly/plotly-2.24.1.min.js"></script>
    <style>
        .dataTables_wrapper .dataTables_length, .dataTables_wrapper .dataTables_filter, 
        .dataTables_wrapper .dataTables_info, .dataTables_wrapper .dataTables_paginate { color: #cbd5e1 !important; margin-bottom: 10px; }
        table.dataTable tbody tr { background-color: #0f172a; color: #f8fafc; }
        table.dataTable tbody tr:hover { background-color: #1e293b !important; }
        table.dataTable thead th { border-bottom: 1px solid #334155; }
        table.dataTable.no-footer { border-bottom: 1px solid #334155; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6">
    <div class="max-w-7xl mx-auto space-y-6">
        <!-- Header -->
        <div class="bg-slate-950 border border-slate-800 rounded-2xl p-6 shadow-xl flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold text-white">SBDC Industry Supply Chain</h1>
                <p class="text-slate-400 text-sm">Dynamic Chunk-loaded Analysis</p>
            </div>
            <div class="flex flex-col sm:flex-row gap-4 w-full md:w-auto">
                <select id="regionFilter" class="bg-slate-800 border border-slate-700 text-white rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500 w-full sm:w-48">
                    <option value="central_in_sbdc">Central IN SBDC</option>
<option value="east_central_in_sbdc">East Central IN SBDC</option>
<option value="hoosier_heartland_sbdc">Hoosier Heartland SBDC</option>
<option value="north_centeral_in_sbdc">North Centeral IN SBDC</option>
<option value="north_central_in_sbdc">North Central IN SBDC</option>
<option value="northeast_in_sbdc">Northeast IN SBDC</option>
<option value="northwest_in_sbdc">Northwest IN SBDC</option>
<option value="south_central_in_sbdc">South Central IN SBDC</option>
<option value="southeast_in_sbdc">Southeast IN SBDC</option>
<option value="southwest_in_sbdc">Southwest IN SBDC</option>
<option value="west_central_in_sbdc">West Central IN SBDC</option>
                </select>
                <select id="clusterFilter" class="bg-slate-800 border border-slate-700 text-white rounded-lg px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500 w-full sm:w-64">
                    <option value="ic01">IC01 - Agribusiness Food Processing and Technology</option>
<option value="ic03">IC03 - Chemcials and Chemical-based Products</option>
<option value="ic03">IC03 - Chemicals and Chemical-based</option>
<option value="ic03">IC03 - Chemicals and Chemical-based Products</option>
<option value="ic05">IC05 - Forest and Wood Products</option>
<option value="ic06">IC06 - Glass and Ceramics</option>
<option value="ic09">IC09 - Agribusiness Food Processing and Technology</option>
<option value="ic09">IC09 - Biomedical Biotechnical and Healthcare</option>
<option value="ic12">IC12 - Transportation and Logistics</option>
<option value="ic16">IC16 - Glass and Ceramics</option>
<option value="ic16">IC16 - Primary Metal</option>
<option value="ic17">IC17 - Fabricated Metal Product Manuacturing</option>
<option value="ic17">IC17 - Fabricated Metal Product Manufacturing</option>
<option value="ic17">IC17 - Fabricated Metal Products Manufacturing</option>
<option value="ic18">IC18 - Machinery Manufacturing</option>
<option value="ic20">IC20 - Electrical Equipment Appliance and Component</option>
<option value="ic21">IC21 - Transportation Equipment Manufacturing</option>
                </select>
            </div>
        </div>

        <!-- KPI Cards -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-slate-950 border border-slate-800 rounded-2xl p-6 shadow-lg">
                <h3 class="text-slate-400 text-xs font-semibold uppercase tracking-wider">Total Purchases</h3>
                <p class="text-3xl font-extrabold text-white mt-2" id="kpiTotal">$0</p>
            </div>
            <div class="bg-slate-950 border border-slate-800 rounded-2xl p-6 shadow-lg">
                <h3 class="text-slate-400 text-xs font-semibold uppercase tracking-wider">In-Region (Retained)</h3>
                <p class="text-3xl font-extrabold text-emerald-400 mt-2" id="kpiInRegion">$0</p>
            </div>
            <div class="bg-slate-950 border border-slate-800 rounded-2xl p-6 shadow-lg">
                <h3 class="text-slate-400 text-xs font-semibold uppercase tracking-wider">Imported (Leakage)</h3>
                <p class="text-3xl font-extrabold text-rose-400 mt-2" id="kpiImported">$0</p>
            </div>
        </div>

        <!-- Plotly Chart -->
        <div class="bg-slate-950 border border-slate-800 rounded-2xl p-6 shadow-xl">
            <h2 class="text-lg font-bold text-white mb-2">Top 10 Supply Chain Industries by Total Purchases</h2>
            <div id="barChart" class="w-full h-80"></div>
        </div>

        <!-- DataTable -->
        <div class="bg-slate-950 border border-slate-800 rounded-2xl p-6 shadow-xl overflow-hidden">
            <table id="supplyTable" class="w-full text-left text-sm pt-4">
                <thead>
                    <tr class="text-slate-300 uppercase tracking-wide text-xs">
                        <th>NAICS Industry</th>
                        <th>In-Region Purchases</th>
                        <th>% In-Region</th>
                        <th>Imported Purchases</th>
                        <th>% Imported</th>
                        <th>Total Purchases</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <script>
        let dataTable;
        const formatCurrency = (val) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 }).format(val);

        $(document).ready(function() {
            dataTable = $('#supplyTable').DataTable({
                columns: [
                    { data: 'NAICS', render: (data, type, row) => '<b>' + (row['NAICS'] || 'Unknown') + '</b>' },
                    { data: 'Purchases from In-region', render: (data) => formatCurrency(data) },
                    { data: '% In-region Purchases', render: (data) => (data * 100).toFixed(1) + '%' },
                    { data: 'Imported Purchases', render: (data) => formatCurrency(data) },
                    { data: '% Imported Purchases', render: (data) => (data * 100).toFixed(1) + '%' },
                    { data: 'Total Purchases', render: (data) => formatCurrency(data) }
                ],
                pageLength: 15,
                order: [[5, 'desc']],
                responsive: true
            });

            async function fetchAndLoadData() {
                const region = $('#regionFilter').val();
                const cluster = $('#clusterFilter').val();
                
                // FIXED relative path for GitHub Pages deployment
                const filepath = `./data/${region}_${cluster}.json`;

                try {
                    const response = await fetch(filepath);
                    if (!response.ok) throw new Error('File not found');
                    const data = await response.json();
                    updateDashboard(data);
                } catch (err) {
                    console.error('Error loading data:', err);
                    dataTable.clear().draw();
                    $('#kpiTotal, #kpiInRegion, #kpiImported').text('$0');
                }
            }

            function updateDashboard(data) {
                dataTable.clear().rows.add(data).draw();

                let totalPurchases = 0, inRegion = 0, imported = 0;
                data.forEach(d => {
                    totalPurchases += d['Total Purchases'] || 0;
                    inRegion += d['Purchases from In-region'] || 0;
                    imported += d['Imported Purchases'] || 0;
                });

                $('#kpiTotal').text(formatCurrency(totalPurchases));
                $('#kpiInRegion').text(formatCurrency(inRegion));
                $('#kpiImported').text(formatCurrency(imported));

                let chartData = [...data].sort((a, b) => b['Total Purchases'] - a['Total Purchases']).slice(0, 10);
                let labels = chartData.map(d => {
                    let name = String(d['NAICS'] || 'Unknown');
                    return name.length > 30 ? name.substring(0, 30) + '...' : name;
                });

                let trace1 = { x: chartData.map(d => d['Purchases from In-region']), y: labels, name: 'In-Region', orientation: 'h', type: 'bar', marker: {color: '#34d399'} };
                let trace2 = { x: chartData.map(d => d['Imported Purchases']), y: labels, name: 'Imported', orientation: 'h', type: 'bar', marker: {color: '#fb7185'} };
                let layout = {
                    barmode: 'stack', paper_bgcolor: 'rgba(0,0,0,0)', plot_bgcolor: 'rgba(0,0,0,0)',
                    margin: { l: 200, r: 20, t: 20, b: 40 },
                    xaxis: { tickfont: { color: '#94a3b8' }, gridcolor: '#1e293b' },
                    yaxis: { tickfont: { color: '#94a3b8' }, autorange: 'reversed' },
                    legend: { font: { color: '#94a3b8' } }
                };
                Plotly.newPlot('barChart', [trace1, trace2], layout, {responsive: true, displayModeBar: false});
            }

            $('#regionFilter, #clusterFilter').on('change', fetchAndLoadData);
            fetchAndLoadData(); // Initial bootstrap load
        });
    </script>
</body>
</html>
